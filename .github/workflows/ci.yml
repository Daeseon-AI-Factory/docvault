name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./internal/...

  windows:
    # Verifies the clipboard agent actually builds on Windows and registers as a
    # service. GUI-only behavior (live clipboard capture) still needs a VM or a
    # real device — see docs/WINDOWS_VM_TEST.md.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build server + clipboard agent
        run: |
          go build ./...
          go build -o docvault-clip.exe ./cmd/clipagent

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -count=1 ./internal/...

      - name: Windows service install/uninstall smoke
        shell: pwsh
        run: |
          ./docvault-clip.exe install
          sc.exe query DocVaultClipAgent
          ./docvault-clip.exe uninstall
