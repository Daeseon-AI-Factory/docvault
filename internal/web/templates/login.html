<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DocVault</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div style="text-align:right;margin-bottom:.5rem;">
        <button type="button" id="langToggle" data-i18n-skip
          style="background:transparent;border:1px solid #cbd5e1;color:#64748b;border-radius:6px;padding:3px 10px;font-size:.75rem;cursor:pointer;">🌐 English</button>
      </div>
      <h1>DocVault</h1>
      {{if .InstanceLabel}}<div class="text-muted" style="text-align:center;margin:-.5rem 0 1rem;">{{.InstanceLabel}}</div>{{end}}
      {{if .Error}}
      <div class="alert alert-danger">{{.Error}}</div>
      {{end}}
      <form method="POST" action="/login">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Sign In</button>
      </form>
    </div>
  </div>
  <script>
  (function(){
    var DEFAULT_LANG="{{.DefaultLang}}";
    var DICT={"Username":"사용자명","Password":"비밀번호","Sign In":"로그인",
      "Invalid username or password":"사용자명 또는 비밀번호가 올바르지 않습니다",
      "Invalid credentials":"인증 정보가 올바르지 않습니다",
      "Too many attempts. Please try again later.":"시도가 너무 많습니다. 잠시 후 다시 시도하세요."};
    var REVERSE={}; Object.keys(DICT).forEach(function(k){REVERSE[DICT[k]]=k;});
    function requestedLang(){try{var l=(new URLSearchParams(window.location.search)).get('lang');return(l==='en'||l==='ko')?l:'';}catch(e){return '';}}
    function apply(lang){
      var all=document.querySelectorAll('*');
      for(var i=0;i<all.length;i++){
        var el=all[i];
        if(el.children.length||el.hasAttribute('data-i18n-skip'))continue;
        var orig=el.getAttribute('data-i18n-o'); if(orig===null)orig=el.textContent;
        var key=orig.trim(); var out=(lang==='ko')?DICT[key]:REVERSE[key]; if(!out)continue;
        if(el.getAttribute('data-i18n-o')===null)el.setAttribute('data-i18n-o',orig);
        el.textContent=orig.replace(key,out);
      }
      document.title=(lang==='ko')?'로그인 - DocVault':'Login - DocVault';
    }
    function cur(){try{return localStorage.getItem('dvlang')||requestedLang()||DEFAULT_LANG||'ko';}catch(e){return DEFAULT_LANG||'ko';}}
    function setLang(l){try{localStorage.setItem('dvlang',l);}catch(e){}document.documentElement.lang=l;apply(l);var b=document.getElementById('langToggle');if(b)b.textContent=(l==='ko')?'🌐 English':'🌐 한국어';}
    document.addEventListener('DOMContentLoaded',function(){
      setLang(requestedLang()||cur());
      var b=document.getElementById('langToggle');
      if(b)b.addEventListener('click',function(){setLang(cur()==='ko'?'en':'ko');});
    });
  })();
  </script>
</body>
</html>
