{{define "content"}}
<div class="card" style="max-width:600px;">
  <div class="card-header">Edit User: {{.EditUser.FullName}}</div>
  <form method="POST" action="/admin/users/{{.EditUser.ID}}/edit">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="form-group">
      <label>Username</label>
      <input type="text" class="form-control" value="{{.EditUser.Username}}" disabled>
    </div>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="full_name" class="form-control" value="{{.EditUser.FullName}}" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" class="form-control" value="{{.EditUser.Email}}" required>
    </div>
    <div class="form-group">
      <label>Role</label>
      <select name="role" class="form-control">
        <option value="employee" {{if eq (printf "%s" .EditUser.Role) "employee"}}selected{{end}}>Employee</option>
        <option value="manager" {{if eq (printf "%s" .EditUser.Role) "manager"}}selected{{end}}>Manager</option>
        <option value="admin" {{if eq (printf "%s" .EditUser.Role) "admin"}}selected{{end}}>Admin</option>
      </select>
    </div>
    <div class="form-group">
      <label>Department</label>
      <input type="text" name="department" class="form-control" value="{{.EditUser.Department}}">
    </div>
    <div class="form-group">
      <label>Status</label>
      <select name="is_active" class="form-control">
        <option value="true" {{if .EditUser.IsActive}}selected{{end}}>Active</option>
        <option value="false" {{if not .EditUser.IsActive}}selected{{end}}>Disabled</option>
      </select>
    </div>
    <div class="d-flex gap-1">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="/admin/users" class="btn btn-outline">Cancel</a>
    </div>
  </form>

  <hr style="margin:1.5rem 0;">
  <div class="card-header">Reset Password</div>
  <form method="POST" action="/admin/users/{{.EditUser.ID}}/reset-password">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="form-group">
      <label>New Password</label>
      <input type="password" name="password" class="form-control" required minlength="8">
    </div>
    <button type="submit" class="btn btn-danger">Reset Password</button>
  </form>
</div>
{{end}}
