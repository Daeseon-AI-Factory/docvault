{
  "options": {
    "logger_plugin": "tls",
    "logger_tls_endpoint": "/api/events/osquery",
    "logger_tls_period": 30,
    "config_plugin": "tls",
    "enroll_tls_endpoint": "/api/enroll",
    "host_identifier": "hostname",
    "schedule_splay_percent": 10
  },
  "schedule": {
    "file_events": {
      "query": "SELECT target_path, action, time, md5, sha256 FROM file_events;",
      "interval": 30,
      "removed": false,
      "description": "File integrity monitoring events (create/modify/delete/rename)"
    },
    "usb_devices": {
      "query": "SELECT vendor, model, serial, removable FROM usb_devices WHERE removable = 1;",
      "interval": 60,
      "description": "Removable USB device detection"
    },
    "process_events": {
      "query": "SELECT pid, path, cmdline, parent, time FROM process_events WHERE path NOT LIKE 'C:\\Windows\\%';",
      "interval": 30,
      "removed": false,
      "description": "Non-system process execution"
    },
    "logged_in_users": {
      "query": "SELECT user, host, time, pid FROM logged_in_users WHERE user != '';",
      "interval": 300,
      "description": "Currently logged in users"
    },

    "messenger_file_access": {
      "query": "SELECT pof.pid, p.path, p.name, pof.path AS accessed_file FROM process_open_files pof JOIN processes p ON pof.pid = p.pid WHERE (p.name IN ('KakaoTalk.exe','kakaotalk.exe','Telegram.exe','telegram.exe','Slack.exe','slack.exe','LINE.exe','WeChat.exe','Discord.exe','Teams.exe','ms-teams.exe') OR p.path LIKE '%KakaoTalk%' OR p.path LIKE '%Telegram%' OR p.path LIKE '%Slack%') AND (pof.path LIKE '%.pdf' OR pof.path LIKE '%.doc%' OR pof.path LIKE '%.xls%' OR pof.path LIKE '%.ppt%' OR pof.path LIKE '%.dwg' OR pof.path LIKE '%.dxf' OR pof.path LIKE '%.stp' OR pof.path LIKE '%.step' OR pof.path LIKE '%.igs' OR pof.path LIKE '%.iges' OR pof.path LIKE '%.zip' OR pof.path LIKE '%.rar' OR pof.path LIKE '%.7z' OR pof.path LIKE '%.csv' OR pof.path LIKE '%.txt' OR pof.path LIKE '%.bom');",
      "interval": 15,
      "description": "Messenger apps accessing document/engineering files (KakaoTalk, Telegram, Slack, etc.)"
    },

    "email_file_access": {
      "query": "SELECT pof.pid, p.path, p.name, pof.path AS accessed_file FROM process_open_files pof JOIN processes p ON pof.pid = p.pid WHERE (p.name IN ('OUTLOOK.EXE','outlook.exe','thunderbird.exe','Thunderbird.exe','MailMaster.exe') OR p.path LIKE '%Outlook%' OR p.path LIKE '%Thunderbird%') AND (pof.path LIKE '%.pdf' OR pof.path LIKE '%.doc%' OR pof.path LIKE '%.xls%' OR pof.path LIKE '%.ppt%' OR pof.path LIKE '%.dwg' OR pof.path LIKE '%.dxf' OR pof.path LIKE '%.stp' OR pof.path LIKE '%.step' OR pof.path LIKE '%.zip' OR pof.path LIKE '%.rar' OR pof.path LIKE '%.7z' OR pof.path LIKE '%.csv');",
      "interval": 15,
      "description": "Email clients accessing document files (Outlook, Thunderbird)"
    },

    "cloud_upload_access": {
      "query": "SELECT pof.pid, p.path, p.name, pof.path AS accessed_file FROM process_open_files pof JOIN processes p ON pof.pid = p.pid WHERE (p.name IN ('chrome.exe','msedge.exe','firefox.exe','whale.exe','brave.exe') OR p.path LIKE '%Chrome%' OR p.path LIKE '%Edge%' OR p.path LIKE '%Firefox%' OR p.path LIKE '%Whale%') AND (pof.path LIKE '%.pdf' OR pof.path LIKE '%.doc%' OR pof.path LIKE '%.xls%' OR pof.path LIKE '%.ppt%' OR pof.path LIKE '%.dwg' OR pof.path LIKE '%.dxf' OR pof.path LIKE '%.stp' OR pof.path LIKE '%.zip' OR pof.path LIKE '%.rar' OR pof.path LIKE '%.csv') AND pof.path NOT LIKE '%Cache%' AND pof.path NOT LIKE '%Temp%';",
      "interval": 30,
      "description": "Browser accessing document files (potential cloud upload via Google Drive, Naver Mail, etc.)"
    },

    "extension_rename_detect": {
      "query": "SELECT target_path, action, time, md5 FROM file_events WHERE action = 'MOVED' OR action = 'RENAMED';",
      "interval": 15,
      "removed": false,
      "description": "File rename/move events — server-side checks for extension changes"
    },

    "removable_drive_file_copy": {
      "query": "SELECT target_path, action, time, md5, sha256 FROM file_events WHERE (target_path LIKE 'E:\\%' OR target_path LIKE 'F:\\%' OR target_path LIKE 'G:\\%' OR target_path LIKE 'H:\\%') AND action IN ('CREATED','UPDATED');",
      "interval": 15,
      "removed": false,
      "description": "Files written to removable drives (USB copy detection)"
    },

    "network_share_copy": {
      "query": "SELECT target_path, action, time, md5 FROM file_events WHERE target_path LIKE '\\\\\\\\%' AND action IN ('CREATED','UPDATED');",
      "interval": 30,
      "removed": false,
      "description": "Files written to network shares (UNC paths)"
    },

    "print_jobs": {
      "query": "SELECT pof.pid, p.name, p.path, pof.path AS spool_file FROM process_open_files pof JOIN processes p ON pof.pid = p.pid WHERE p.name = 'spoolsv.exe' AND pof.path LIKE '%.SPL';",
      "interval": 30,
      "description": "Active print spool files (print job detection)"
    },

    "screen_capture_detect": {
      "query": "SELECT pid, path, name, cmdline FROM processes WHERE (name IN ('SnippingTool.exe','ScreenClippingHost.exe','ShareX.exe','Lightshot.exe','Greenshot.exe','PicPick.exe') OR cmdline LIKE '%screenshot%' OR cmdline LIKE '%screen capture%');",
      "interval": 30,
      "description": "Screen capture tool execution"
    }
  },
  "file_paths": {
    "monitored_documents": [
      "C:\\Users\\%\\Documents\\%%",
      "C:\\Users\\%\\Desktop\\%%",
      "C:\\Users\\%\\Downloads\\%%"
    ],
    "monitored_engineering": [
      "D:\\Engineering\\%%",
      "D:\\CAD\\%%",
      "E:\\SharedDocs\\%%"
    ],
    "monitored_removable": [
      "E:\\%%",
      "F:\\%%",
      "G:\\%%",
      "H:\\%%"
    ],
    "monitored_network": [
      "\\\\fileserver\\%%",
      "\\\\nas\\%%"
    ]
  },
  "file_accesses": ["monitored_documents", "monitored_engineering"],
  "events": {
    "enable_file_events": true,
    "enable_process_events": true
  },
  "packs": {}
}
