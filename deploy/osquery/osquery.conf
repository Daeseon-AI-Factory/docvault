{
  "options": {
    "logger_plugin": "tls",
    "logger_tls_endpoint": "/api/events/osquery",
    "logger_tls_period": 60,
    "config_plugin": "tls",
    "enroll_tls_endpoint": "/api/enroll",
    "host_identifier": "hostname",
    "schedule_splay_percent": 10
  },
  "schedule": {
    "file_events": {
      "query": "SELECT target_path, action, time, md5, sha256 FROM file_events;",
      "interval": 30,
      "removed": false,
      "description": "File integrity monitoring events"
    },
    "usb_devices": {
      "query": "SELECT vendor, model, serial, removable FROM usb_devices WHERE removable = 1;",
      "interval": 60,
      "description": "Removable USB device monitoring"
    },
    "process_events": {
      "query": "SELECT pid, path, cmdline, parent, time FROM process_events WHERE path NOT LIKE 'C:\\Windows\\%';",
      "interval": 30,
      "removed": false,
      "description": "Non-system process execution events"
    },
    "logged_in_users": {
      "query": "SELECT user, host, time, pid FROM logged_in_users WHERE user != '';",
      "interval": 300,
      "description": "Currently logged in users"
    }
  },
  "file_paths": {
    "monitored_documents": [
      "C:\\Users\\%\\Documents\\%%",
      "C:\\Users\\%\\Desktop\\%%",
      "C:\\Users\\%\\Downloads\\%%"
    ],
    "monitored_engineering": [
      "D:\\Engineering\\%%",
      "D:\\CAD\\%%",
      "E:\\SharedDocs\\%%"
    ],
    "monitored_removable": [
      "E:\\%%",
      "F:\\%%",
      "G:\\%%"
    ]
  },
  "file_accesses": ["monitored_documents", "monitored_engineering"],
  "events": {
    "enable_file_events": true,
    "enable_process_events": true
  },
  "packs": {}
}
