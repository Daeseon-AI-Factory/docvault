<style>

  .langtoggle button.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .wrap{max-width:860px;margin:0 auto;padding:0 20px}
  .hero{background:var(--bg);color:#fff;padding:46px 20px 60px}
  .hero h1{font-size:30px;margin:0 0 10px;line-height:1.25}
  .hero p{font-size:17px;color:#cbd5e1;margin:0;max-width:640px}
  section{padding:38px 0;border-bottom:1px solid var(--line)}
  h2{font-size:23px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
  h2 .ic{font-size:24px}
  .lead{color:#334155;font-size:16px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
  .card .ic{font-size:26px}
  .card b{display:block;margin:8px 0 4px;font-size:15px}
  .card small{color:var(--muted)}
  .analogy{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:18px;margin-top:14px;color:#1e3a8a}
  ol.steps{list-style:none;counter-reset:s;padding:0;margin:18px 0 0}
  ol.steps>li{counter-increment:s;position:relative;padding:0 0 26px 56px;margin:0}
  ol.steps>li:before{content:counter(s);position:absolute;left:0;top:0;width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:17px}
  ol.steps>li:after{content:"";position:absolute;left:18px;top:42px;bottom:6px;width:2px;background:var(--line)}
  ol.steps>li:last-child:after{display:none}
  ol.steps h3{margin:4px 0 8px;font-size:18px}
  .code{position:relative;background:var(--code);color:#e2e8f0;border-radius:10px;padding:14px 44px 14px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;white-space:pre-wrap;word-break:break-all;margin:10px 0}
  .code .copy{position:absolute;top:8px;right:8px;background:#1e293b;border:1px solid #334155;color:#cbd5e1;border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer}
  .code .copy:active{background:var(--brand)}
  .note{background:var(--warnbg);border:1px solid var(--warnline);color:var(--warn);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14.5px}
  .ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14.5px}
  .faq dt{font-weight:700;margin-top:16px}
  .faq dd{margin:6px 0 0;color:#334155}
  footer{padding:30px 20px 60px;color:var(--muted);font-size:13px;text-align:center}
  .pill{display:inline-block;background:#e0e7ff;color:#3730a3;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:8px;vertical-align:middle}

</style>

function setLang(l){
  document.querySelectorAll('[data-i18n]').forEach(function(e){ e.innerHTML = I18N[l][e.dataset.i18n] || ''; });
  document.documentElement.lang = l;
  document.getElementById('b-ko').classList.toggle('active', l==='ko');
  document.getElementById('b-en').classList.toggle('active', l==='en');
  try{ localStorage.setItem('dvlang', l); }catch(_){}
}
function cp(btn){
  var t = btn.parentNode.innerText.replace(/^copy/, '').trim();
  navigator.clipboard && navigator.clipboard.writeText(t);
  var o = btn.textContent; btn.textContent='✓'; setTimeout(function(){btn.textContent=o;}, 1200);
}
setLang((function(){ try{ return localStorage.getItem('dvlang') || 'ko'; }catch(_){ return 'ko'; } })());
