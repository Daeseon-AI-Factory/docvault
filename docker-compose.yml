# DocVault local/dev stack (no Caddy, server exposed directly on :8080).
# For internet/production use docker-compose.prod.yml (adds Caddy auto-HTTPS).
#
# Generate secrets first:  bash scripts/gen-env.sh localhost
# Then:                    docker compose up -d --build
# Migrations and the admin seed run automatically. Open http://localhost:8080
#
# No secrets are hardcoded here — everything comes from .env.

name: docvault-dev

x-app-env: &app-env
  DOCVAULT_DB_URL: postgres://docvault_app:${DOCVAULT_DB_PASSWORD:?run scripts/gen-env.sh first}@db:5432/docvault?sslmode=disable
  DOCVAULT_MASTER_KEY: ${DOCVAULT_MASTER_KEY:?run scripts/gen-env.sh first}
  DOCVAULT_JWT_SECRET: ${DOCVAULT_JWT_SECRET:?run scripts/gen-env.sh first}
  DOCVAULT_OSQUERY_PSK: ${DOCVAULT_OSQUERY_PSK:?run scripts/gen-env.sh first}
  DOCVAULT_VAULT_PATH: /vault
  DOCVAULT_LISTEN_ADDR: ":8080"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: docvault
      POSTGRES_USER: docvault_app
      POSTGRES_PASSWORD: ${DOCVAULT_DB_PASSWORD:?run scripts/gen-env.sh first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docvault_app -d docvault"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    restart: "no"

  seed:
    build: .
    command: ["seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      DOCVAULT_ADMIN_PASSWORD: ${DOCVAULT_ADMIN_PASSWORD:-}
    restart: "no"

  server:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *app-env
    ports:
      - "8080:8080"
    volumes:
      - vaultdata:/vault

volumes:
  pgdata:
  vaultdata:
